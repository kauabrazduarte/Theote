services:
  postgres:
    image: postgres:16-alpine
    container_name: theote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-theote}
      POSTGRES_USER: ${POSTGRES_USER:-theote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - theote-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theote} -d ${POSTGRES_DB:-theote}"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  theote-postgres-data:
